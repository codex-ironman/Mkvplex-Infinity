name: Attach full source archive to Mkvplex Infinity release

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct HTTPS download URL for the verified full source ZIP
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-full-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify full source archive
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_URL" == https://* ]] || { echo 'Source URL must use HTTPS'; exit 1; }
          curl --fail --location --retry 3 --output Mkvplex-Infinity-v2.1.5-build21500112-FULL-SOURCE.zip "$SOURCE_URL"
          echo '79de7f02c804b8f16a9d3eaf9a17299f3f8bd4a487822909691ce2de01eeaef2  Mkvplex-Infinity-v2.1.5-build21500112-FULL-SOURCE.zip' | sha256sum --check
      - name: Attach full source ZIP to the existing draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view 'v2.1.5-mkvplex.2' --repo "$GITHUB_REPOSITORY"
          gh release upload 'v2.1.5-mkvplex.2' \
            Mkvplex-Infinity-v2.1.5-build21500112-FULL-SOURCE.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
